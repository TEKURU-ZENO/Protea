[project]
name = "protea-api"
version = "1.0.0"
description = "FastAPI Backend for PROTEA AI Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "asyncpg>=0.29.0",
    "neo4j>=5.18.0",
    "redis>=5.0.3",
    "qdrant-client>=1.8.0",
    "boto3>=1.34.0",
    "structlog>=24.1.0",
    "loguru>=0.7.2",
    "prometheus-client>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]
