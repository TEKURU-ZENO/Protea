name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'services/api/**'
      - 'shared/**'
      - 'configs/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/api/**'
      - 'shared/**'
      - 'configs/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install --system -r services/api/pyproject.toml

    - name: Run pytest
      run: |
        # pytest execution placeholder
        echo "pytest tests/backend/"
