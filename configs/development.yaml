environment: development
debug: true

database:
  postgres:
    url: postgresql://protea_user:protea_secure_password@localhost:5432/protea
    pool_min_size: 5
    pool_max_size: 20
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: neo4j_secure_password
  redis:
    host: localhost
    port: 6379
    db: 0
  qdrant:
    host: localhost
    port: 6333
  minio:
    endpoint: localhost:9000
    access_key: minio_admin
    secret_key: minio_secure_password
    secure: false

telemetry:
  prometheus_enabled: true
  otlp_endpoint: http://localhost:4317
