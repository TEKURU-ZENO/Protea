model:
  name: "biological-reasoner"
  version: "v1.0.0"
  type: "rag_agent"
  parameters:
    llm_model: "claude-3-5-sonnet"
    temperature: 0.0
    max_tokens: 2048
    system_prompt_path: "agents/reasoning/system_prompt.txt"
    multi_hop:
      max_hops: 3
      expansion_limit: 10
    confidence_threshold: 0.85
