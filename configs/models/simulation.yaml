model:
  name: "neuralode-cell-simulator"
  version: "v1.0.0"
  type: "dynamical_system_solver"
  parameters:
    solver: "heun"
    tolerance_atol: 0.0001
    tolerance_rtol: 0.001
    step_size: 0.1
    max_steps: 1000
    degradation_rate: 0.05
    hill_coefficient: 2.0
    neural_network:
      layers: [64, 64]
      activation: "tanh"
